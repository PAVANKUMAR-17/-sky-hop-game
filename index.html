<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#8bdbe9">
  <title>Sky Hop — Flappy Bird</title>
  <style>
    :root{--ink:#17344a;--paper:#fff9e9;--coral:#ed8063;--sun:#ffd85d}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 8%,#f8ffdd 0,transparent 38%),linear-gradient(140deg,#82d8e9,#a5e9dc 54%,#f8e9b3)}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .page{width:min(100%,520px);padding:14px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 11px}
    .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:1000;letter-spacing:-.06em;white-space:nowrap}
    .bird-logo{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:13px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:22px;transform:rotate(-5deg)}
    .tag{padding:8px 11px;border:1px solid #ffffff;border-radius:99px;background:#fff9e9b8;font-size:10px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
    .frame{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:25px;background:#91e1ec;box-shadow:0 10px 0 #15334b24,0 23px 55px #1b55662b;isolation:isolate}
    canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:manipulation}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#fff3,transparent 60%,#143d5210);pointer-events:none}
    .panel{width:min(100%,325px);padding:22px 21px 19px;border:2px solid var(--ink);border-radius:24px;background:#fff9e9f2;box-shadow:7px 7px 0 var(--ink);text-align:center;pointer-events:auto;backdrop-filter:blur(5px);animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
    @keyframes pop{from{transform:scale(.84) translateY(8px);opacity:0}to{transform:scale(1);opacity:1}}
    .eyebrow{display:inline-block;padding:6px 11px;border-radius:99px;background:var(--coral);color:white;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:14px 0 10px;font-size:clamp(34px,8vw,44px);font-weight:1000;letter-spacing:-.07em;line-height:.98}
    h1 span{color:#e77459}
    .desc{max-width:255px;margin:0 auto 18px;color:#456174;font-size:13px;font-weight:650;line-height:1.5}
    .primary{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;border:2px solid var(--ink);border-radius:15px;background:var(--sun);box-shadow:0 5px 0 var(--ink);font-size:15px;font-weight:950;transition:transform .12s,box-shadow .12s}
    .primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    .sub{margin-top:14px;color:#587284;font-size:10px;font-weight:900;letter-spacing:.02em}
    .hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:none}
    .pill{min-width:83px;padding:7px 15px;border:2px solid var(--ink);border-radius:13px;background:#fff9e9e8;box-shadow:3px 3px 0 #15334b50;text-align:center}
    .pill small{display:block;color:#597383;font-size:9px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
    .pill strong{font-size:25px;font-weight:1000;line-height:1.05}
    .stats{display:flex;gap:9px;margin:12px 0}
    .stat{flex:1;padding:9px 5px;border:1.5px solid white;border-radius:15px;background:#fff9e9ad;text-align:center}
    .stat small{display:block;color:#557082;font-size:9px;font-weight:950;letter-spacing:.1em;text-transform:uppercase}
    .stat strong{display:block;font-size:18px;font-weight:1000;line-height:1.3}
    .hint{text-align:center;color:#28536a;font-size:11px;font-weight:800;opacity:.9}
    .hidden{display:none!important}
    .sound{display:grid;place-items:center;width:37px;height:37px;flex:0 0 37px;border:1px solid white;border-radius:13px;background:#fff9e9b8;font-size:17px}
    @media(max-height:720px){.page{width:min(100%,420px);padding:6px}.top{margin-bottom:6px}.brand{font-size:18px}.bird-logo{width:32px;height:32px;font-size:18px}.frame{border-radius:19px}.stats{margin:7px 0}.stat{padding:6px 4px}.stat strong{font-size:16px}.hint{font-size:9px}.panel{padding:15px}h1{font-size:33px}.desc{margin-bottom:11px}.primary{min-height:43px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand"><span class="bird-logo">🐤</span><span>SKY HOP<span style="color:#ed8063">.</span></span></div>
      <span class="tag">✦ One more try</span>
      <button id="soundBtn" class="sound" type="button" aria-label="Toggle sound" title="Toggle sound">🔊</button>
    </header>

    <section class="frame" id="gameFrame" aria-label="Flappy Bird game">
      <canvas id="game" width="480" height="600" aria-label="Game area. Tap, click or press Space to fly."></canvas>
      <div id="hud" class="hud hidden" aria-live="polite">
        <div class="pill"><small>Score</small><strong id="score">0</strong></div>
        <div class="pill"><small>Best</small><strong id="best">0</strong></div>
      </div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <span id="eyebrow" class="eyebrow">✦ The sky is yours</span>
          <h1 id="title">Ready,<br><span>birdie?</span></h1>
          <p id="desc" class="desc">A little flap, a little luck. Weave through the pipes and see how far you can fly.</p>
          <button id="playBtn" class="primary" type="button"><span>▶</span><span id="playText">Let's fly</span></button>
          <div id="sub" class="sub">TAP · CLICK · SPACE TO FLAP</div>
        </div>
      </div>
    </section>

    <div class="stats">
      <div class="stat"><small>Personal best</small><strong id="bestStat">0 🏆</strong></div>
      <div class="stat"><small>Flight status</small><strong id="status">Ready ✨</strong></div>
      <div class="stat"><small>Pipes passed</small><strong id="passed">0</strong></div>
    </div>
    <div class="hint">Press <b>SPACE</b> or <b>↑</b> to flap · Tap anywhere in the game to fly</div>
  </main>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const GROUND_H = 64;
    const PIPE_W = 68;
    const PIPE_GAP_MIN = 158;
    const PIPE_GAP_MAX = 178;
    const PIPE_SPACING = 220;
    const $ = (id) => document.getElementById(id);

    const ui = {
      overlay: $('overlay'), hud: $('hud'), score: $('score'), best: $('best'),
      bestStat: $('bestStat'), passed: $('passed'), status: $('status'),
      eyebrow: $('eyebrow'), title: $('title'), desc: $('desc'),
      playBtn: $('playBtn'), playText: $('playText'), sub: $('sub'), soundBtn: $('soundBtn')
    };

    let state = 'ready'; // ready | playing | gameover
    let bird;
    let pipes = [];
    let particles = [];
    let score = 0;
    let best = 0;
    let elapsed = 0;
    let lastTimestamp = 0;
    let soundEnabled = true;
    let audioContext = null;
    let animationStarted = false;
    let shakeTime = 0;

    try { best = Number(localStorage.getItem('skyhop-best') || 0); } catch (_) { best = 0; }
    ui.best.textContent = String(best);
    ui.bestStat.textContent = `${best} 🏆`;

    const random = (min, max) => min + Math.random() * (max - min);

    function playTone(frequency, duration = 0.07, type = 'sine') {
      if (!soundEnabled) return;
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        gain.gain.setValueAtTime(0.055, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      } catch (_) { /* Audio is optional; the game still plays without it. */ }
    }

    function makePipe(x) {
      const gap = random(PIPE_GAP_MIN, PIPE_GAP_MAX);
      const minTop = 70;
      const maxTop = H - GROUND_H - gap - 65;
      return { x, top: random(minTop, maxTop), gap, passed: false };
    }

    function resetGame() {
      bird = { x: 125, y: 270, vy: 0, rotation: 0, wingPhase: 0 };
      pipes = [makePipe(345), makePipe(345 + PIPE_SPACING), makePipe(345 + PIPE_SPACING * 2)];
      particles = [];
      score = 0;
      elapsed = 0;
      shakeTime = 0;
      ui.score.textContent = '0';
      ui.passed.textContent = '0';
    }

    function spawnFlapParticles() {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: bird.x - 13, y: bird.y + random(-5, 8),
          vx: random(-95, -35), vy: random(-45, 45),
          life: 0.4, maxLife: 0.4, radius: random(2, 4)
        });
      }
    }

    function flap() {
      if (state !== 'playing') return;
      bird.vy = -430; // Upward impulse, in canvas pixels per second.
      bird.wingPhase = 0;
      spawnFlapParticles();
      playTone(620, 0.065);
    }

    function startGame() {
      resetGame();
      state = 'playing';
      ui.overlay.classList.add('hidden');
      ui.hud.classList.remove('hidden');
      ui.playText.textContent = 'Fly again';
      ui.status.textContent = 'Flying 🪽';
      bird.vy = -430; // The opening input always launches the bird immediately.
      spawnFlapParticles();
      playTone(620, 0.065);
      lastTimestamp = 0;
      if (!animationStarted) startAnimation();
    }

    function finishGame() {
      if (state !== 'playing') return;
      state = 'gameover';
      shakeTime = 0.18;
      playTone(150, 0.23, 'triangle');
      ui.hud.classList.add('hidden');
      ui.status.textContent = 'Landed 💫';
      const isNewRecord = score > best;
      if (isNewRecord) {
        best = score;
        try { localStorage.setItem('skyhop-best', String(best)); } catch (_) { /* Storage can be disabled. */ }
      }
      ui.best.textContent = String(best);
      ui.bestStat.textContent = `${best} 🏆`;
      ui.eyebrow.textContent = isNewRecord && score > 0 ? '✦ New personal best' : '✦ Flight complete';
      ui.title.innerHTML = score >= 10 ? 'Sky<br><span>legend!</span>' : score > 0 ? 'Nice<br><span>flying!</span>' : 'Oop—<br><span>bonk!</span>';
      ui.desc.textContent = score > 0
        ? `You flew past ${score} pipe${score === 1 ? '' : 's'}. Ready for another little adventure?`
        : 'Every great flyer starts somewhere. Tap to give it another go!';
      ui.playText.textContent = 'Fly again';
      ui.sub.textContent = `YOUR SCORE: ${score} · BEST: ${best}`;
      ui.overlay.classList.remove('hidden');
    }

    function drawRoundedRect(x, y, width, height, radius) {
      if (height <= 0 || width <= 0) return;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, '#8bdbe9');
      gradient.addColorStop(0.68, '#b7edf0');
      gradient.addColorStop(1, '#e3f5c9');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      // Sun
      ctx.fillStyle = '#fff8d7';
      ctx.beginPath(); ctx.arc(370, 100, 35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fffde7';
      ctx.beginPath(); ctx.arc(359, 90, 19, 0, Math.PI * 2); ctx.fill();

      // Slowly drifting clouds make the scene look alive before the first flap too.
      for (let i = 0; i < 4; i++) {
        const rawX = (i * 151 - elapsed * 18) % (W + 130);
        const x = (rawX + W + 130) % (W + 130) - 55;
        const y = 92 + (i % 3) * 75;
        ctx.fillStyle = '#fff9e9b8';
        ctx.beginPath();
        ctx.ellipse(x, y, 28, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 20, y - 7, 23, 15, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 43, y, 29, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#80d1ae';
      ctx.beginPath(); ctx.moveTo(0, H - GROUND_H - 58);
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H - GROUND_H - 45 + Math.sin((x + elapsed * 28) / 57) * 18 + Math.sin(x / 29) * 8);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

      ctx.fillStyle = '#59bd9a';
      ctx.beginPath(); ctx.moveTo(0, H - GROUND_H - 27);
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H - GROUND_H - 10 + Math.sin((x - elapsed * 34) / 43) * 14 + Math.sin(x / 22) * 7);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    }

    function drawPipe(pipe) {
      const bottomY = pipe.top + pipe.gap;
      // Upper pipe body and lip
      ctx.fillStyle = '#218c68';
      drawRoundedRect(pipe.x + 5, 0, PIPE_W - 10, pipe.top - 7, 7);
      ctx.fillStyle = '#55ce87';
      ctx.fillRect(pipe.x + 13, 0, 10, Math.max(0, pipe.top - 7));
      ctx.fillStyle = '#279d70';
      drawRoundedRect(pipe.x, pipe.top - 18, PIPE_W, 25, 7);
      ctx.fillStyle = '#54d28d';
      ctx.fillRect(pipe.x + 9, pipe.top - 14, 10, 18);

      // Lower pipe body and lip
      ctx.fillStyle = '#218c68';
      drawRoundedRect(pipe.x + 5, bottomY, PIPE_W - 10, H - GROUND_H - bottomY, 7);
      ctx.fillStyle = '#55ce87';
      ctx.fillRect(pipe.x + 13, bottomY + 2, 10, Math.max(0, H - GROUND_H - bottomY - 2));
      ctx.fillStyle = '#279d70';
      drawRoundedRect(pipe.x - 5, bottomY - 2, PIPE_W + 10, 25, 7);
      ctx.fillStyle = '#54d28d';
      ctx.fillRect(pipe.x + 5, bottomY + 2, 10, 17);
    }

    function drawGround() {
      ctx.fillStyle = '#f2d17a';
      ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
      ctx.fillStyle = '#b5dc79';
      ctx.fillRect(0, H - GROUND_H, W, 12);
      const offset = (elapsed * 100) % 30;
      for (let x = -offset; x < W; x += 30) {
        ctx.fillStyle = '#d9b35d';
        ctx.beginPath();
        ctx.moveTo(x, H - GROUND_H + 12);
        ctx.lineTo(x + 13, H - GROUND_H + 12);
        ctx.lineTo(x + 3, H - GROUND_H + 19);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#a57b46';
      ctx.fillRect(0, H - 8, W, 8);
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      // Outline/body
      ctx.fillStyle = '#17344a';
      ctx.beginPath(); ctx.ellipse(0, 1, 21, 17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffca4c';
      ctx.beginPath(); ctx.ellipse(-1, -2, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
      // Wing visibly flaps throughout the flight
      const wingLift = Math.sin(bird.wingPhase) * 4;
      ctx.fillStyle = '#f2a928';
      ctx.beginPath(); ctx.ellipse(-7, 4 + wingLift, 9, 5, -0.18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#17344a'; ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.ellipse(-7, 4 + wingLift, 9, 5, -0.18, 0, Math.PI * 2); ctx.stroke();
      // Eye and beak
      ctx.fillStyle = '#fff9e8';
      ctx.beginPath(); ctx.ellipse(9, -7, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#18344a';
      ctx.beginPath(); ctx.arc(12, -7, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8065';
      ctx.beginPath(); ctx.moveTo(15, 1); ctx.lineTo(29, 5); ctx.lineTo(15, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = '#fff9e8';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.save();
      if (shakeTime > 0) {
        const amount = shakeTime * 22;
        ctx.translate(random(-amount, amount), random(-amount, amount));
      }
      drawBackground();
      for (const pipe of pipes) drawPipe(pipe);
      drawParticles();
      drawGround();
      drawBird();
      ctx.restore();
    }

    function update(dt) {
      elapsed += dt;
      // Decorative idle bob means the bird is visibly alive before starting.
      if (state === 'ready') {
        bird.y = 270 + Math.sin(elapsed * 3.2) * 9;
        bird.rotation = Math.sin(elapsed * 2.2) * 0.045;
        bird.wingPhase += dt * 9;
      } else if (state === 'playing') {
        // Time-based physics keeps movement consistent on high- and low-refresh screens.
        bird.vy = Math.min(bird.vy + 1250 * dt, 560);
        bird.y += bird.vy * dt;
        bird.rotation = Math.max(-0.52, Math.min(0.95, bird.vy / 610));
        bird.wingPhase += dt * 18;

        // Pipes move continuously from right to left while the run is active.
        const pipeSpeed = 170;
        for (const pipe of pipes) {
          pipe.x -= pipeSpeed * dt;
          if (!pipe.passed && pipe.x + PIPE_W < bird.x) {
            pipe.passed = true;
            score += 1;
            ui.score.textContent = String(score);
            ui.passed.textContent = String(score);
            playTone(820, 0.055);
            if (score > best) ui.best.textContent = String(score);
          }
        }

        if (pipes.length && pipes[0].x + PIPE_W < -10) {
          pipes.shift();
          pipes.push(makePipe(pipes[pipes.length - 1].x + PIPE_SPACING));
        }

        // Circle-ish bird collision box, separated from the drawing dimensions.
        const radiusX = 15;
        const radiusY = 13;
        let collided = bird.y - radiusY <= 0 || bird.y + radiusY >= H - GROUND_H;
        for (const pipe of pipes) {
          const overlapsX = bird.x + radiusX > pipe.x && bird.x - radiusX < pipe.x + PIPE_W;
          const outsideGap = bird.y - radiusY < pipe.top || bird.y + radiusY > pipe.top + pipe.gap;
          if (overlapsX && outsideGap) { collided = true; break; }
        }
        if (collided) finishGame();
      }

      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
      shakeTime = Math.max(0, shakeTime - dt);
    }

    function animationLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.033);
      lastTimestamp = timestamp;
      update(Math.max(0, dt));
      render();
      requestAnimationFrame(animationLoop);
    }

    function startAnimation() {
      if (animationStarted) return;
      animationStarted = true;
      lastTimestamp = 0;
      requestAnimationFrame(animationLoop);
    }

    function handleGameInput(event) {
      if (event && event.target && event.target.closest && event.target.closest('button')) return;
      if (event && event.cancelable) event.preventDefault();
      if (state === 'playing') flap();
      else startGame();
    }

    ui.playBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      startGame();
    });

    // Attach input to the whole frame so taps work even when the translucent overlay is visible.
    $('gameFrame').addEventListener('pointerdown', handleGameInput, { passive: false });

    window.addEventListener('keydown', (event) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(event.code)) {
        event.preventDefault();
        if (state === 'playing') flap();
        else startGame();
      } else if (event.code === 'Enter' && state !== 'playing') {
        startGame();
      }
    });

    ui.soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      ui.soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      ui.soundBtn.setAttribute('aria-label', soundEnabled ? 'Mute sound' : 'Enable sound');
      if (soundEnabled) playTone(600, 0.06);
    });

    resetGame();
    startAnimation();
  })();
  </script>
</body>
</html>
