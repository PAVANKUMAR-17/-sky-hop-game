<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#8bdbe9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sky Hop"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sky Hop — Flappy Bird</title>
<style>
:root{--ink:#15334b;--cream:#fff9e9;--mint:#b6efb5;--coral:#ff896d;--yellow:#ffd85d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 8%,#f8ffdd 0,transparent 37%),linear-gradient(140deg,#82d8e9,#a5e9dc 54%,#f8e9b3)}button{font:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}.controls{display:flex;gap:6px}.sound:focus-visible,.primary:focus-visible{outline:3px solid #ed8063;outline-offset:3px}.page{width:min(100%,520px);padding:15px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 11px}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:-.06em;font-size:22px}.birdicon{display:grid;place-items:center;width:38px;height:38px;background:var(--cream);border:2px solid var(--ink);border-radius:13px;box-shadow:3px 3px 0 var(--ink);font-size:22px;transform:rotate(-5deg)}.tag{font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;background:#fff9e9b5;border:1px solid white;border-radius:99px;padding:8px 12px}.sound{display:grid;place-items:center;width:37px;height:37px;border-radius:13px;border:1px solid white;background:#fff9e9b5;font-size:17px}.frame{position:relative;border:3px solid var(--ink);border-radius:25px;overflow:hidden;box-shadow:0 12px 0 #15334b25,0 24px 60px #1b55662a;background:#91e1ec}canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#fff3,transparent 60%,#143d5210);pointer-events:none}.panel{pointer-events:auto;text-align:center;width:min(100%,325px);padding:23px 21px 20px;border:2px solid var(--ink);border-radius:24px;background:#fff9e9f2;box-shadow:7px 7px 0 var(--ink);backdrop-filter:blur(5px);animation:pop .32s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.84) translateY(8px);opacity:0}to{transform:scale(1);opacity:1}}.eyebrow{display:inline-block;color:white;background:#ed8063;border-radius:100px;padding:6px 11px;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(32px,8vw,43px);line-height:.98;letter-spacing:-.07em;margin:13px 0 10px;font-weight:1000}h1 span{color:#e77459}.desc{font-size:13px;line-height:1.5;color:#456174;font-weight:650;margin:0 auto 18px;max-width:255px}.primary{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;min-height:50px;border:2px solid var(--ink);border-radius:15px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);font-weight:950;font-size:15px;transition:transform .12s,box-shadow .12s}.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.sub{margin-top:14px;font-size:10px;font-weight:900;color:#587284}.stats{display:flex;gap:9px;margin:12px 0}.stat{flex:1;text-align:center;background:#fff9e9ad;border:1.5px solid #fff;border-radius:15px;padding:9px}.stat small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:#557082}.stat strong{display:block;font-size:20px;line-height:1.2;font-weight:1000;letter-spacing:-.04em}.hint{text-align:center;font-size:11px;font-weight:800;color:#28536a;opacity:.85}.hint kbd{display:inline-block;background:var(--cream);border:1px solid #abcfd0;border-radius:6px;padding:2px 6px;box-shadow:0 2px 0 #abcfd0;font-size:10px;margin:0 2px}.hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:none}.pill{border:2px solid var(--ink);border-radius:13px;padding:7px 17px;text-align:center;min-width:83px;background:#fff9e9e8;box-shadow:3px 3px 0 #15334b50}.pill small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:950;color:#597383}.pill strong{font-size:25px;line-height:1.05;font-weight:1000}.hidden{display:none!important}@media(max-height:700px){.page{width:min(100%,420px);padding:7px}.top{margin-bottom:5px}.brand{font-size:18px}.birdicon{width:32px;height:32px;font-size:18px}.frame{border-radius:19px}.stats{margin:7px 0}.stat{padding:6px}.stat strong{font-size:17px}.hint{font-size:9px}.panel{padding:15px}h1{font-size:33px}.desc{margin-bottom:11px}.primary{min-height:43px}}
</style></head>
<body><main class="page"><header class="top"><div class="brand"><span class="birdicon">🐤</span><span>SKY HOP<span style="color:#ed8063">.</span></span></div><span class="tag">✦ One more try</span><div class="controls"><button id="soundBtn" class="sound" aria-label="Toggle sound" title="Toggle sound">🔊</button><button id="vibeBtn" class="sound" aria-label="Toggle vibration" title="Toggle vibration">📳</button><button id="fullBtn" class="sound" aria-label="Toggle full screen" title="Toggle full screen">⛶</button></div></header>
<section class="frame" aria-label="Flappy Bird game"><canvas id="game" width="480" height="600" aria-label="Tap, click, or press Space to fly through pipes"></canvas><div id="hud" class="hud hidden"><div class="pill"><small>Score</small><strong id="score">0</strong></div><div class="pill"><small>Best</small><strong id="best">0</strong></div></div>
<div id="overlay" class="overlay"><div class="panel"><span class="eyebrow" id="eyebrow">✦ The sky is yours</span><h1 id="title">Ready,<br><span>birdie?</span></h1><p id="desc" class="desc">A little flap, a little luck. Weave through the pipes and see how far you can fly.</p><button id="playBtn" class="primary"><span>▶</span><span id="playText">Let's fly</span></button><div id="sub" class="sub">TAP · CLICK · SPACE TO FLAP</div></div></div></section>
<div class="stats"><div class="stat"><small>Personal best</small><strong id="bestStat">0 🏆</strong></div><div class="stat"><small>Flight status</small><strong id="status">Ready ✨</strong></div><div class="stat"><small>Pipe passed</small><strong id="passed">0</strong></div></div><div class="hint">Press <kbd>SPACE</kbd> or <kbd>↑</kbd> to flap · Tap anywhere to fly</div></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,ground=64,$=id=>document.getElementById(id);let mode='ready',bird,pipes,score,frame=0,last=0,raf=0,sound=true,vibration=true,audio=null,particles=[],shake=0,best=0;try{best=+(localStorage.getItem('skyhop-best')||0)}catch{}$('best').textContent=$('bestStat').textContent=best;const rand=(a,b)=>a+Math.random()*(b-a);
function chirp(freq=550,dur=.07,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function reset(){bird={x:125,y:260,vy:0,rot:0};pipes=[];score=0;frame=0;particles=[];shake=0;for(let i=0;i<3;i++)pipes.push(makePipe(380+i*210));$('score').textContent='0'}function makePipe(x){const gap=rand(148,190),top=rand(80,H-ground-gap-75);return{x,top,gap,passed:false}}
function start(){if(raf)cancelAnimationFrame(raf);raf=0;reset();mode='playing';$('overlay').classList.add('hidden');$('hud').classList.remove('hidden');$('status').textContent='Flying 🪽';flap();last=performance.now();raf=requestAnimationFrame(loop)}function flap(){if(mode!=='playing')return;bird.vy=-5.7;chirp(640,.075);if(vibration&&navigator.vibrate)navigator.vibrate(12);for(let i=0;i<5;i++)particles.push({x:bird.x-10,y:bird.y+rand(-5,8),vx:rand(-2,-.5),vy:rand(-1.4,1.4),life:1,r:rand(2,4)})}
function gameOver(){if(mode!=='playing')return;mode='over';shake=8;chirp(160,.25,'triangle');if(vibration&&navigator.vibrate)navigator.vibrate([45,35,70]);$('hud').classList.add('hidden');$('status').textContent='Landed 💫';const record=score>best;if(record){best=score;try{localStorage.setItem('skyhop-best',best)}catch{}}$('best').textContent=$('bestStat').textContent=best;$('eyebrow').textContent=record&&score>0?'✦ New personal best':'✦ Flight complete';$('title').innerHTML=score>=10?'Sky<br><span>legend!</span>':score>0?'Nice<br><span>flying!</span>':'Oop—<br><span>bonk!</span>';$('desc').textContent=score>=10?'You’re on a roll! The sky looks good on you. Ready to beat that score?':score>0?'You flew past '+score+' pipe'+(score===1?'':'s')+'. Fancy another little adventure?':'Every great flyer starts somewhere. Give it another go!';$('playText').textContent='Fly again';$('sub').textContent='YOUR SCORE: '+score+' · BEST: '+best;$('overlay').classList.remove('hidden');$('passed').textContent=score}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bdbe9');g.addColorStop(.72,'#b7edf0');g.addColorStop(1,'#e3f5c9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8d7';ctx.beginPath();ctx.arc(370,100,35,0,7);ctx.fill();ctx.fillStyle='#fffde7';ctx.beginPath();ctx.arc(359,90,19,0,7);ctx.fill();for(let i=0;i<4;i++){let x=((i*151-frame*.28)%(W+140)+W+140)%(W+140)-55,y=92+i%3*75;ctx.fillStyle='#fff9e9a8';ctx.beginPath();ctx.ellipse(x,y,28,10,0,0,7);ctx.ellipse(x+20,y-7,23,15,0,0,7);ctx.ellipse(x+43,y,29,10,0,0,7);ctx.fill()}ctx.fillStyle='#80d1ae';ctx.beginPath();ctx.moveTo(0,H-ground-58);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H-ground-45+Math.sin((x+frame*.5)/57)*18+Math.sin(x/29)*8);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#59bd9a';ctx.beginPath();ctx.moveTo(0,H-ground-27);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H-ground-10+Math.sin((x-frame*.6)/43)*14+Math.sin(x/22)*7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function pipe(p){const w=65;ctx.fillStyle='#218c68';rr(p.x+5,0,w-10,p.top-8,7);ctx.fillStyle='#55ce87';ctx.fillRect(p.x+12,0,10,p.top-8);ctx.fillStyle='#279d70';rr(p.x,p.top-17,w,25,7);ctx.fillStyle='#54d28d';ctx.fillRect(p.x+9,p.top-14,10,21);let by=p.top+p.gap;ctx.fillStyle='#218c68';rr(p.x,by,w,H-ground-by,7);ctx.fillStyle='#55ce87';ctx.fillRect(p.x+12,by+2,10,H-ground-by-2);ctx.fillStyle='#279d70';rr(p.x-5,by-2,w+10,25,7);ctx.fillStyle='#54d28d';ctx.fillRect(p.x+5,by+2,10,17)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.fillStyle='#17344a';ctx.beginPath();ctx.ellipse(0,1,21,17,0,0,7);ctx.fill();ctx.fillStyle='#ffca4c';ctx.beginPath();ctx.ellipse(-1,-2,18,14,0,0,7);ctx.fill();ctx.fillStyle='#fff9e8';ctx.beginPath();ctx.ellipse(9,-7,8,9,0,0,7);ctx.fill();ctx.fillStyle='#18344a';ctx.beginPath();ctx.arc(12,-7,3.2,0,7);ctx.fill();ctx.fillStyle='#ff8065';ctx.beginPath();ctx.moveTo(15,1);ctx.lineTo(29,5);ctx.lineTo(15,9);ctx.closePath();ctx.fill();ctx.strokeStyle='#17344a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-7,4,9,5,Math.sin(frame*.3)*.3,0,7);ctx.stroke();ctx.restore()}
function floor(){ctx.fillStyle='#f2d17a';ctx.fillRect(0,H-ground,W,ground);ctx.fillStyle='#b5dc79';ctx.fillRect(0,H-ground,W,12);for(let x=-((frame*2)%30);x<W;x+=30){ctx.fillStyle='#d9b35d';ctx.beginPath();ctx.moveTo(x,H-ground+12);ctx.lineTo(x+13,H-ground+12);ctx.lineTo(x+3,H-ground+19);ctx.closePath();ctx.fill()}ctx.fillStyle='#a57b46';ctx.fillRect(0,H-8,W,8)}
function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.75;if(shake<.4)shake=0}sky();pipes.forEach(pipe);particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle='#fff9e8';ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill()});ctx.globalAlpha=1;floor();drawBird();ctx.restore()}
function loop(now){raf=0;if(mode!=='playing'){draw();return}const dt=Math.min((now-last)/16.67,2)||1;last=now;frame+=dt;bird.vy=Math.min(bird.vy+.31*dt,7.5);bird.y+=bird.vy*dt;bird.rot=Math.max(-.55,Math.min(.95,bird.vy*.09));pipes.forEach(p=>{p.x-=2.7*dt;if(!p.passed&&p.x+65<bird.x){p.passed=true;score++;$('score').textContent=score;$('passed').textContent=score;chirp(820,.06);if(score>best)$('best').textContent=score}});if(pipes[0].x<-80){pipes.shift();pipes.push(makePipe(pipes[pipes.length-1].x+210))}particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.035*dt});let hit=bird.y-14<0||bird.y+14>H-ground;for(const p of pipes){if(bird.x+15>p.x-3&&bird.x-15<p.x+65&&(bird.y-12<p.top||bird.y+12>p.top+p.gap)){hit=true;break}}if(hit)gameOver();draw();if(mode==='playing')raf=requestAnimationFrame(loop)}
function idle(){if(mode==='ready'||mode==='over'){frame+=.4;if(mode==='ready'){bird.y=260+Math.sin(frame*.08)*8;bird.rot=Math.sin(frame*.07)*.06}draw();raf=requestAnimationFrame(idle)}else raf=0}$('playBtn').addEventListener('click',()=>{if(mode!=='playing')start()});c.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();if(mode==='playing')flap();else start()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(mode!=='playing')start();else flap()}if(e.code==='Enter'&&mode!=='playing')start()});$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';$('soundBtn').setAttribute('aria-pressed',String(sound));if(sound)chirp(600,.06)});$('vibeBtn').addEventListener('click',()=>{vibration=!vibration;$('vibeBtn').textContent=vibration?'📳':'📴';$('vibeBtn').setAttribute('aria-pressed',String(vibration));if(vibration&&navigator.vibrate)navigator.vibrate(15)});$('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();$('fullBtn').textContent='⤢'}else{await document.exitFullscreen();$('fullBtn').textContent='⛶'}}catch{ $('status').textContent='Full screen unavailable' }});document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'⤢':'⛶'});if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}reset();draw();idle()})();
</script></body></html>
